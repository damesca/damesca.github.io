  I am an applied cryptographer researcher and engineer (PhD) working at the
  intersection of theory and real-world systems. My research focuses on building
  secure and efficient protocols, with a strong focus on decentralized scenarios
  - secure multi-party computation, zero-knowledge proofs, post-quantum primitives,
  blockchain - and turning them into deployable software. Previously worked as a 
  researcher and in industry; currently working as a postdoctoral researcher.

