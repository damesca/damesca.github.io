# ============================================================================
#  International publications.  Newest first is conventional.
#  (National publications go in publications_national.yml — same format.)
#
#  Fields per entry:
#    id       (required) — unique slug; it becomes the anchor of the entry, so
#                          https://damesca.github.io/#<id> links straight to it.
#                          Once published, DON'T change it: shared links break.
#    title    (required)
#    authors  (required) — full author list; your own name (matching profile.me)
#                          is automatically bolded.
#    venue    (required) — conference/journal, e.g. "CRYPTO 2024"
#    year     (required)
#    note     (optional) — e.g. "Best Paper Award", "to appear"
#    links    (optional) — any subset of: pdf, eprint, doi, code, slides, video
#
#  --- Featured works (the cards in the top-right column) -------------------
#    featured        (optional) — true to show it as a card up top.
#    featured_order  (optional) — position among the cards; lower comes first.
#                                 Shared with projects.yml, so the numbers must
#                                 not collide between the two files.
#    card_summary    (optional) — one sentence shown on the card.
#
#  At most 6 cards are ever rendered, no matter how many entries are flagged.
# ============================================================================

