#    name          (required) — project name
#    description   (required) — a line or two
#    year          (optional)
#    technologies  (optional) — list, e.g. [Rust, Python]
#    links         (optional) — any subset of: repo, demo, paper, docs
#
#  --- Featured works (the cards in the top-right column) -------------------
