# ============================================================================
#  Local preview — no Ruby needed on your machine.
#
#    docker compose up          start the dev server (first run installs gems)
#    Ctrl+C                     stop it
#    docker compose down        stop and remove the container
#
#  Then open:  http://localhost:4000/gh-cv/
#  (drop the /gh-cv/ if you set baseurl: "" in _config.yml)
# ============================================================================

services:
  jekyll:
    image: ruby:3.3-bookworm
    working_dir: /site
    command: >
      bash -lc "bundle install && bundle exec jekyll serve
      --host 0.0.0.0 --livereload --force_polling --trace"
    ports:
      - "4000:4000"    # site
      - "35729:35729"  # livereload
    volumes:
      - .:/site                 # your project, live-mounted
      - bundle-cache:/usr/local/bundle   # persist installed gems between runs
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle-cache:
