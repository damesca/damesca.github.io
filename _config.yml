# ============================================================================
#  Site configuration
#  Edit the values in this file and in _data/*.yml, then rebuild.
#  NOTE: after changing this file you must restart `docker compose up`
#        (Jekyll does not hot-reload _config.yml).
# ============================================================================

# --- Identity (used by the browser tab, SEO tags, sitemap) ------------------
title: "Daniel Morales — CV"
# Shown in search results and whenever the link is shared. Keep it to ~160
# characters; jekyll-seo-tag turns it into <meta name="description"> and the
# Open Graph description.
description: "Applied cryptography researcher and engineer (PhD). Secure multi-party computation, zero-knowledge proofs, post-quantum cryptography and blockchain."
author: "Daniel Morales"
email: "damesca.crypto@protonmail.com"
lang: "en"

# Preview image used when the link is shared (Open Graph / Twitter cards).
# Leading slash: jekyll-seo-tag makes it absolute using `url` below.
image: "/assets/dani_profile.jpg"

# Profiles that identify you; jekyll-seo-tag emits them as JSON-LD sameAs,
# which helps search engines tie the page to your academic identity.
social:
  name: "Daniel Morales"
  links:
    - "https://scholar.google.com/citations?user=exdZ-7YAAAAJ"
    - "https://orcid.org/0000-0002-6932-7437"
    - "https://github.com/damesca"
    - "https://www.linkedin.com/in/daniel-morales-escalera/"

# --- URLs -------------------------------------------------------------------
# `url`     : your site's origin, no trailing slash.
# `baseurl` : subpath the site is served from.
#
#   Project page  -> repo named "gh-cv"          => baseurl: "/gh-cv"
#                    served at https://<user>.github.io/gh-cv/
#   User page     -> repo named "<user>.github.io" => baseurl: ""
#                    served at https://<user>.github.io/
#
# All internal links in the templates use the `relative_url` filter, so you
# only ever have to change these two lines.
url: "https://damesca.github.io"
baseurl: ""

# --- Build ------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Files that should never appear in the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docker-compose.yml
  - vendor
  - .github
  - .bundle

# Cleaner output URLs (no .html suffixes).
permalink: pretty
